# Section 301 excess-capacity scenarios (USTR proposals of 2026-11-25).
#
# Builds `actual` and three scenarios in one vintage, through the same code and
# the same 484(f) weight plan, so each scenario can be compared with actual
# exactly:
#   actual           - current law. The proposed duties are off.
#   ec301_proposed   - the proposed duties from 2027-04-01 at the rates the
#                      notices state first.
#   ec301_no_deals   - every economy at its no-deal rate.
#   ec301_all_deals  - every economy at its deal rate.
# All three scenarios also apply the proposed Brazil change (finished aircraft
# pay a flat 10%) from 2027-04-01.
#
# What to expect:
#   * actual equals the current baseline in every existing column. It gains
#     all-zero rate_s301ec / statutory_rate_s301ec panel columns, all-zero
#     mean_s301ec / etr_s301ec columns in daily_by_authority and pct_s301ec in
#     the quality report, and no 2027-04-01 snapshot.
#   * each scenario equals actual before 2027-04-01 and has one extra
#     snapshot, bnd_2027-04-01.
#
# Validation root; does not move `latest`.
#   bash scripts/submit_build_array.sh --config config/build/s301ec.yaml
#   Rscript scripts/verify_s301ec_snapshot.R <vintage dir>
model_data_root: /nfs/roberts/project/pi_nrs36/shared/model_data/Tariff-Rate-Tracker/.validation/s301ec-fable
policy_params_path: config/policy_params.yaml

scenarios:
  - ec301_proposed
  - ec301_no_deals
  - ec301_all_deals

use_hts_dates: false        # policy effective dates
weight_mode: required       # 484(f) per-interval weights; fail loud if missing
update_latest: false
allow_partial: false
verify: true                # finalize runs scripts/verify_build.R
