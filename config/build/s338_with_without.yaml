# Build-run config: tariff rates WITH vs WITHOUT today's (2026-07-20) Section 338
# Canada announcement.
#   bash scripts/submit_build_array.sh --config config/build/s338_with_without.yaml
#
# §338 is a BASELINE authority (config/policy_params.yaml → section_338, turn-on
# 2026-08-19), so the always-built `actual` series carries it = the WITH case.
# The no_s338 counterfactual zeroes rate_s338 via the step-7g kill-switch = the
# WITHOUT case. Everything else (§232, existing §301, IEEPA-invalidation, §122
# expiry) is held at current law on both sides, so diffing
#   <vintage>/actual  vs  <vintage>/scenarios/no_s338
# on daily_overall / daily_by_authority isolates the marginal effect of today's
# announcement. Weighted (required) so the import-weighted ETR contrast is
# available. Does NOT move `latest`.

model_data_root: /nfs/roberts/project/pi_nrs36/shared/model_data/Tariff-Rate-Tracker
policy_params_path: config/policy_params.yaml

scenarios:
  - no_s338

use_hts_dates: false
weight_mode: required
update_latest: false        # comparison build — do NOT repoint production latest
allow_partial: false
verify: true                # finalize runs scripts/verify_build.R against the vintage
