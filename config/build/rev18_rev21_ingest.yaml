# rev_18 - rev_21 ingest candidate: do the four new revisions assemble, and does
# the series move only where the new policy says it should?
#
# rev_18 (policy-dated 2026-09-03) codifies the Section 232 drone action
# (U.S. note 43, PP 11055, headings 9903.08.20-.26); its JSON is reconstructed
# from rev_19 (data/hts_archives/hts_2026_rev_18.PROVENANCE.txt). rev_19
# (2026-09-15) codifies the Section 338 Canada scope change (PP 11064/11065):
# new alcohol / motor-vehicle lists, and those two lists now stack on §232.
# rev_20 (policy-dated 2026-09-29) revises pharma §232 note 40 for its turn-on
# and adds 9903.04.70; its JSON is reconstructed from rev_21
# (data/hts_archives/hts_2026_rev_20.PROVENANCE.txt). rev_21 (2026-10-09) is
# note text only. Two side-data corrections ride along: the note 40(c) list in
# current statistical numbering (resources/s232_pharma_products.csv) and the
# 8479.90.9591 §301 exclusion line (resources/s301_exclusion_lines_curated.csv).
# Expectations:
#
#   * FOUR new snapshot partitions: valid_from 2026-09-03 (rev_18), 2026-09-15
#     (rev_19), 2026-09-29 (rev_20, replacing bnd_2026-09-29) and 2026-10-09
#     (rev_21). rev_17 now ends 2026-09-02. The later boundary mints
#     (2026-11-10, 2026-12-04) are now owned by rev_21.
#   * Canada / Mexico rows move at EVERY date: the USMCA monthly claim shares
#     now run to 2026-08, and the baseline `usmca_shares: since` window pools
#     2025-07 through the newest file (was ..2026-02). Pooled share: Canada
#     0.870 -> 0.840, Mexico 0.885 -> 0.874.
#   * Every other partition-row before 2026-07-01 IDENTICAL to the previous
#     master vintage (2026-08-31-12).
#   * From 2026-07-01: 8479.90.9591 from China gains the 9903.88.69 exclusion.
#   * From 2026-07-31: forced-labor / Brazil §301 move only on pharma lines
#     whose codes changed in the note 40(c) list (patented-pharma carve-out).
#   * 2026-09-03..09-14: additionally drone-scope lines (8806, the 8807 /
#     8504.40.9580 / 8537.10.9170 basket lines).
#   * From 2026-09-15: additionally rate_s338 on Canada rows only.
#   * From 2026-09-29: additionally rate_232 on the pharma lines whose codes
#     changed in the note 40(c) list (the duty itself was already on at 09-29).
#
# A rate difference outside those lines is worth stopping for.
#
# Publishes a vintage but does NOT repoint `latest` — bless deliberately with
#   Rscript scripts/publish_vintage.R --latest-only <vintage>
# after comparing against the previous master vintage:
#   Rscript scripts/compare_vintages.R <.../2026-08-31-12> \
#     <.../.validation/rev18-rev21-ingest/<vintage>>
