# Scenario: the Section 301 "excess capacity" actions USTR proposed on
# 2026-11-25 take effect on 2027-04-01 and every economy reaches an agreement,
# so each pays its lower rate (Singapore's 10% adds nothing to its 12.5%
# forced-labor duty).
#
# The rates and rules live in config/policy_params.yaml under
# section_301_excess_capacity; this file only switches the action on and picks
# an outcome for each economy. It also switches on the proposed modification of
# the Brazil Section 301 action from the same date: finished aircraft pay a
# flat 10% (the sugar proposal is not modeled).
#
# Compare with `actual`, which has neither. Both series have a snapshot that
# starts on 2027-04-01 (the baseline boundary list includes the date), so they
# line up interval by interval.
section_301_excess_capacity:
  enabled: true
  outcome:
    eu: deal
    japan: deal
    switzerland: deal
    korea: deal
    taiwan: deal
    bangladesh: deal
    cambodia: deal
    indonesia: deal
    malaysia: deal
    thailand: deal
    china: deal
    india: deal
    vietnam: deal
    singapore: deal

section_301_brazil:
  modification_2026_11:
    enabled: true
    effective_date: '2027-04-01'
